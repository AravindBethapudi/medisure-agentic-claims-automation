services:
  - type: web
    name: medisure-agentic-claims-automation
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: CORS_ORIGINS
        value: https://medisure-agentic-claims-dashboard.onrender.com

  - type: web
    name: medisure-agentic-claims-dashboard
    runtime: python
    plan: free
    region: oregon
    rootDir: streamlit_app
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.maxUploadSize 2
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: BACKEND_URL
        value: https://medisure-agentic-claims-automation.onrender.com
